[project]
name = "alphadesk"
version = "0.1.0"
description = "An AI investment research desk for US-listed companies, with a paper-trading portfolio."
readme = "README.md"
authors = [
    { name = "Naveen Manjappa", email = "122058418+NaveenManjappa@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.21",
    "langgraph-checkpoint>=4.3.1",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts", "evals"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# evals/ holds the evals and the unit tests of the eval code. The evals themselves are
# marked `eval`, so `-m 'not eval'` leaves them out of `make check`; `make eval` runs them.
testpaths = ["tests", "evals"]
# The repo root on sys.path, so evals/ can import its own modules as the `evals` package.
pythonpath = ["."]
# importlib mode lets tests/ mirror src/ without __init__.py files or name clashes.
asyncio_default_fixture_loop_scope = "function"
# `-p no:deepeval` turns off the pytest plugin DeepEval installs. It only serves
# `deepeval test run`, which we do not use, and it would otherwise load in every run.
addopts = "--strict-markers --import-mode=importlib -p no:deepeval -m 'not eval'"
markers = [
    "unit: fast tests with no network, database or LLM calls",
    "integration: tests that cross a real boundary (API, database, external service)",
    "eval: evals that call a real LLM; run with `make eval`",
]

[dependency-groups]
dev = [
    "deepeval>=4.3.4",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
]
